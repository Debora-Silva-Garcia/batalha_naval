<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste de Salas - Batalha Naval</title>
</head>
<body>
  <h1>Cliente de Teste</h1>
  <p>Abra esta página em duas abas para simular 2 jogadores.</p>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    socket.on("connect", () => {
      console.log("Conectado ao servidor:", socket.id);
      socket.emit("joinGame"); // pede para entrar em uma sala
    });

    socket.on("joinedRoom", (roomId) => {
      console.log("Entrou na sala:", roomId);
    });

    socket.on("startGame", (data) => {
      console.log("Jogo iniciado na sala:", data.roomId);
    });
  </script>
</body>
</html>
