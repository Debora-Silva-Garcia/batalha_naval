<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Batalha Naval Multiplayer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>⚓ Batalha Naval Multiplayer</h1>

  <div id="info">
    <p><strong>Seu ID:</strong> <span id="playerId">...</span></p>
    <p><strong>Sala:</strong> <span id="roomId">...</span></p>
  </div>

  <div id="status">Conectando ao servidor...</div>

  <div id="boards">
    <!-- Painel lateral com embarcações -->
    <div id="shipPanel">
      <h3>Embarcações</h3>
      <div id="shipSelection">
        <button class="shipBtn" data-size="5">🚢 Tamanho 5</button>
        <button class="shipBtn" data-size="4">🚤 Tamanho 4</button>
        <button class="shipBtn" data-size="3">⛵ Tamanho 3</button>
      </div>
      <button id="rotateBtn">↩️ Rotacionar</button>
      <p id="orientationInfo">Orientação: horizontal</p>
    </div>

    <!-- Tabuleiros -->
    <div class="board-container">
      <h2>Seu Tabuleiro</h2>
      <div id="playerBoard" class="board"></div>
    </div>

    <div class="board-container">
      <h2>Tabuleiro do Oponente</h2>
      <div id="enemyBoard" class="board"></div>
    </div>
  </div>

  <div id="instructions">
    <p>🛳️ Escolha uma embarcação e clique no seu tabuleiro para posicioná-la.<br>
    🎯 Depois clique no tabuleiro inimigo para atacar!</p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
